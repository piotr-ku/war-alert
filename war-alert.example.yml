# Copy to one of the config search paths and edit frequently changed
# options:
#
#   /etc/war-alert.yml
#   ~/.config/war-alert/war-alert.yml
#   ./war-alert.yml
#
# Example for local development:
#   cp war-alert.example.yml war-alert.yml
#
# war-alert reloads the config before each poll cycle (and on each webhook
# request) without restarting the process.

# Seconds between polling cycles across all enabled sources.
sleep_delay: 600

classification:
  # Provider name or comma-separated fallback chain: openai, openrouter.
  processor: openai
  openai_model: gpt-4o-mini
  openrouter_model: openai/gpt-4o-mini
  # System prompt for LLM classification. Item text is sent separately
  # as the user message.
  prompt: |
    Classify the user message for a war-alert system.

    Reply JSON only: {"result":"yes|no","justification":"..."}

    Scope (conflict-threatened NATO): Poland, Sweden, Finland,
    Lithuania, Latvia, Estonia.

    result "no" for analysis, forecasts, speculation, or commentary—
    not factual reports.

    result "yes" if the item reports as fact:

    In scope states:
    - embassy/consulate evacuation or citizen-departure advisory
    - Russian diplomats leaving
    - suspected document destruction at Russian mission
    - mobilization or martial law debated, announced, or declared

    Any NATO member:
    - missile attack
    - troop buildup near NATO border
    - border closure or border controls

    Other:
    - nuclear weapons use anywhere
    - NATO services: planned major Russian provocation
    - major factual Russia–NATO provocation
    - Putin address justifying NATO aggression to Russians

    justification: English summary if yes; one short sentence if no.

    If message starts with "Everything is fine, it's just a test.",
    return {"result":"yes","justification":"News correctly recognized as a system test."}

