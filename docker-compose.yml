---

services:
  war-alert:
    image: python:3.13-alpine
    container_name: war-alert
    volumes:
      - .:/app
    working_dir: /app
    restart: always
    command: "/app/war-alert.sh"
    env_file:
      - .env
    environment:
      HEALTH_PORT: "8080"
      WEBHOOK_PORT: "8080"
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request; p=os.environ.get('WEBHOOK_PORT') or os.environ.get('HEALTH_PORT','8080'); urllib.request.urlopen(f'http://127.0.0.1:{p}/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
    name: ${DOCKER_NETWORK:-war-alert}
    external: ${DOCKER_NETWORK_EXTERNAL:-false}
